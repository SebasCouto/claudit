name: tests

# Requisito transversal: claudit debe comportarse igual en Windows, macOS y Linux.
# Los tests corren con la stdlib (unittest), sin dependencias, sobre transcripts
# sinteticos anonimizados (tests/_fixtures.py).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unittest
        run: python -m unittest discover -s tests -v
